# XcodeGen spec for ZeroIn (XcodeGen 2.4x).
# The committed ZeroIn.xcodeproj is hand-written to match; regenerate with
#   brew install xcodegen && xcodegen generate
name: ZeroIn

options:
  bundleIdPrefix: com.wmatt
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"

packages:
  ZeroInCore:
    path: ZeroInCore

targets:
  ZeroIn:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZeroIn
        type: group
    dependencies:
      - package: ZeroInCore
        product: ZeroInCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wmatt.zeroin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "ZeroIn uses the camera to photograph your target so it can measure your shot group."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "ZeroIn reads the target photo you choose so it can measure your shot group."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  ZeroIn:
    build:
      targets:
        ZeroIn: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
