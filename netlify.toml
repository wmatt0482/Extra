# Netlify deploys the Spell Jump game (a static site under car-jump/, no build step).
# The Next.js inbox app at the repo root is not part of this site.

[build]
  publish = "car-jump"
  command = "echo 'static site: nothing to build'"
  # skip the deploy when a push did not touch the game folder or this file
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- car-jump netlify.toml"

[build.environment]
  # the repo root holds an unrelated Next.js app; Netlify must not install or build it, and the
  # Next.js plugin that site creation auto-added must skip this static site
  NETLIFY_SKIP_NPM_INSTALL = "true"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NODE_VERSION = "22"

# The service worker must never be served from a stale cache, or players would keep an old version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Everything else can be cached briefly; the service worker refreshes the app shell in the background.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
