# Netlify deploys learninglab.fun: a static home page (site/) with the Spell Jump game under /spell-jump/
# (car-jump/), the Trail Blazer game under /trail-blazer/ (trail-blazer/) and the Fraction Fright game under
# /fraction-fright/ (fraction-fright/), /wagon-west/ (wagon-west/), assembled into dist/ by build.sh
# (plain bash, no dependencies), plus three Netlify Functions:
# netlify/functions/family.mjs (Netlify Blobs) for cross-device family sync, and netlify/functions/tts.mjs (Google
# Cloud Text-to-Speech → Netlify Blobs) for the natural voice; it reads the key from the GOOGLE_TTS_API_KEY (or
# TexttoVoice) environment variable set in the Netlify UI, never from this file; and netlify/functions/stats.mjs (Netlify
# Blobs) for the anonymous lights-on counter, read with the STATS_KEY environment variable at /stats/.
# The Next.js inbox app at the repo root is not part of this site.

[build]
  publish = "dist"
  command = "bash build.sh"
  # skip the deploy when a push did not touch the site, the games, the functions (netlify/: sync + natural voice),
  # their dependencies or this file
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site build.sh car-jump trail-blazer fraction-fright wagon-west build-crew netlify netlify.toml package.json package-lock.json"

[build.environment]
  # the repo root holds an unrelated Next.js app. Dependencies are installed (the sync function bundles
  # @netlify/blobs from the root package.json) but the app is never built, and the Next.js plugin that site
  # creation auto-added must skip this static site
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NODE_VERSION = "22"

# Family sync API: /api/family/:code[/:key]; natural voice API: /api/tts/status, /api/tts/prepare, /api/tts/clip/:id;
# lights-on counter: /api/stats/ping, /api/stats
# (routes are declared in each function's own `config.path`)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The games' pages use relative URLs, so they must be opened at /spell-jump/, /trail-blazer/, /fraction-fright/ and /wagon-west/ (with the slash).
# Not forced: Netlify matches /spell-jump and /spell-jump/ alike, and a forced rule would loop on /spell-jump/.
[[redirects]]
  from = "/spell-jump"
  to = "/spell-jump/"
  status = 301

[[redirects]]
  from = "/trail-blazer"
  to = "/trail-blazer/"
  status = 301

[[redirects]]
  from = "/fraction-fright"
  to = "/fraction-fright/"
  status = 301

[[redirects]]
  from = "/wagon-west"
  to = "/wagon-west/"
  status = 301

# The service workers must never be served from a stale cache, or players would keep an old version.
[[headers]]
  for = "/spell-jump/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/spell-jump/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/trail-blazer/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/trail-blazer/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/fraction-fright/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/fraction-fright/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/wagon-west/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/wagon-west/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Everything else can be cached briefly; the service worker refreshes the app shell in the background.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Build Crew uses local pinned Three.js and Rapier; relative modules require the trailing slash.
[[redirects]]
  from = "/build-crew"
  to = "/build-crew/"
  status = 301

[[headers]]
  for = "/build-crew/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/build-crew/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
