<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fraction Fright Engine Harness</title>
<style>
  :root { --panel: rgba(20,18,30,0.78); --fg: #f4f1ff; --accent: #7cff4d; }
  html, body { margin: 0; height: 100%; background: #111; color: var(--fg); overflow: hidden;
    font: 12px/1.35 system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #state, #log { position: fixed; z-index: 4; background: var(--panel); border-radius: 8px; padding: 6px 8px; margin: 0;
    font: 11px/1.3 ui-monospace, Menlo, monospace; white-space: pre; pointer-events: none; }
  #state { top: max(6px, env(safe-area-inset-top)); left: max(6px, env(safe-area-inset-left)); }
  #log { top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); max-height: 42vh; overflow: hidden; opacity: 0.85; max-width: 46vw; white-space: pre-wrap; }
  #call { position: fixed; z-index: 5; left: 50%; top: max(8px, env(safe-area-inset-top)); transform: translateX(-50%); font: 900 34px "Arial Black", system-ui; color: #fff;
    text-shadow: 0 2px 0 #1d1b26, 0 0 12px rgba(0,0,0,0.6); pointer-events: none; }
  #call small { display: block; font: 700 13px system-ui; opacity: 0.85; text-align: center; }
  #side { position: fixed; z-index: 6; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  #side button, #results button { font: 800 13px system-ui; padding: 8px 12px; border-radius: 8px; border: 0; background: var(--accent); color: #0d2a00; }
  #results { position: fixed; z-index: 7; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(20,18,30,0.92);
    border: 3px solid var(--accent); border-radius: 14px; padding: 12px 18px; min-width: 240px; display: none; }
  #results h2 { margin: 0 0 6px; color: var(--accent); font: 900 20px system-ui; }
  #results pre { margin: 0 0 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; }
  #hint { position: fixed; z-index: 5; left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--panel); border-radius: 8px; padding: 4px 10px; pointer-events: none; }
  body.noui #log, body.noui #state, body.noui #side, body.noui #hint, body.noui #call { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<pre id="state"></pre>
<pre id="log"></pre>
<div id="call"></div>
<div id="hint">drag on the road or ← → to aim · space / tap to throw · f focus next · r restart</div>
<div id="side"><button id="restartBtn">Restart</button></div>
<div id="results"><h2>Wave over</h2><pre id="resText"></pre><button id="retry">Again</button></div>

<script type="module">
// Engine playground. URL params: road=1|3 (0–1 or 0–3 road + its item list), n (zombies, default 10), big=1, final=1,
// wave (number 1..5), seed, rm=1 (reduced motion), ui=0 (no overlays), sim (speed), tol (tolerance share, default 0.10),
// goo (css colour), fence=iron|picket|stone, weather=clear|fog|bats|stars|rain, auto=1 (throw exactly every 2.4 s),
// sound=0 (mute the WebAudio feel sounds), live (max live at once), twins=1, boss=1, grenade=slime|lava|frost|disco,
// dog=1, lantern=1. Keys: f = focus the next zombie.
import { createGame } from './src/game/engine.js';

const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
if (q.get('ui') === '0') document.body.classList.add('noui');
const num = (k, d) => (q.get(k) != null && q.get(k) !== '' && Number.isFinite(Number(q.get(k))) ? Number(q.get(k)) : d);

// ---- fake items (the app's items.js makes the real ones) ----
const tol = num('tol', 0.10);
const ITEMS_01 = [
  { id: 'q34', kind: 'bounce', say: 'three quarters', show: '3/4', target: 0.75, jumps: { unit: 0.25, count: 3 } },
  { id: 'e58', kind: 'locate', say: 'five eighths', show: '5/8', target: 0.625 },
  { id: 'h12', kind: 'bounce', say: 'one half', show: '1/2', target: 0.5, jumps: { unit: 0.5, count: 1 } },
  { id: 'q14', kind: 'bounce', say: 'one quarter', show: '1/4', target: 0.25, jumps: { unit: 0.25, count: 1 } },
  { id: 't23', kind: 'locate', say: 'two thirds', show: '2/3', target: 2 / 3 },
  { id: 'e78', kind: 'locate', say: 'seven eighths', show: '7/8', target: 0.875 },
  { id: 't13', kind: 'bounce', say: 'one third', show: '1/3', target: 1 / 3 },
  { id: 'e38', kind: 'locate', say: 'three eighths', show: '3/8', target: 0.375 },
  { id: 's16', kind: 'locate', say: 'one sixth', show: '1/6', target: 1 / 6 },
  { id: 's56', kind: 'locate', say: 'five sixths', show: '5/6', target: 5 / 6 },
  { id: 'f25', kind: 'locate', say: 'two fifths', show: '2/5', target: 0.4 },
  { id: 'q24', kind: 'locate', say: 'two quarters', show: '2/4', target: 0.5 },
];
const ITEMS_03 = [
  { id: 'm112', kind: 'locate', say: 'one and one half', show: '1½', target: 1.5 },
  { id: 'i74', kind: 'bounce', say: 'seven quarters', show: '7/4', target: 1.75, jumps: { unit: 0.25, count: 7 } },
  { id: 'm214', kind: 'locate', say: 'two and one quarter', show: '2¼', target: 2.25 },
  { id: 'd25', kind: 'decimal', say: 'two point five', show: '2.5', target: 2.5 },
  { id: 'w3', kind: 'locate', say: 'three', show: '3', target: 3 },
  { id: 'i52', kind: 'locate', say: 'five halves', show: '5/2', target: 2.5 },
  { id: 'm223', kind: 'locate', say: 'two and two thirds', show: '2 2/3', target: 2 + 2 / 3 },
  { id: 'w1', kind: 'locate', say: 'one', show: '1', target: 1 },
  { id: 'i43', kind: 'bounce', say: 'four thirds', show: '4/3', target: 4 / 3, jumps: { unit: 1 / 3, count: 4 } },
  { id: 'h12b', kind: 'locate', say: 'one half', show: '1/2', target: 0.5 },
];
const roadTo = num('road', 1) === 3 ? 3 : 1;
const n = Math.max(1, Math.min(12, num('n', 10)));
let items = (roadTo === 3 ? ITEMS_03 : ITEMS_01).slice(0, n).map((it) => ({ ...it, tolerance: tol }));
// twins=1: a pair of equivalent fractions at the same spot in front; boss=1: a 3-hit boss (final-wave style) at the end
if (q.get('twins') === '1') items = [
  { id: 'tw1', kind: 'locate', say: 'one half', show: '1/2', target: 0.5, twin: 'tw2', tolerance: tol },
  { id: 'tw2', kind: 'locate', say: 'two quarters', show: '2/4', target: 0.5, twin: 'tw1', tolerance: tol }, ...items.filter((it) => it.target !== 0.5)];
if (q.get('boss') === '1') items.push({ id: 'boss', kind: 'boss', name: 'Mayor Mumbles', hits: 3, say: 'nine tenths', show: '9/10', target: 0.9, tolerance: tol,
  forms: [{ show: '9/10', say: 'nine tenths' }, { show: 'nine tenths', say: 'nine tenths' }, { show: '9 × ⅒', say: 'nine times one tenth' }] });
const road = roadTo === 3
  ? { from: 0, to: 3, labels: ['0', '½', '1', '2', '3'], ticks: [0.25, 0.75, 1.25, 1.5, 1.75, 2.25, 2.5, 2.75].map((at) => ({ at })), landmarks: [{ at: 0.5, kind: 'grave' }, { at: 1.5, kind: 'lantern' }, { at: 2.5, kind: 'tree' }] }
  : { from: 0, to: 1, labels: ['0', '½', '1'], ticks: [0.125, 0.25, 0.375, 0.625, 0.75, 0.875].map((at) => ({ at })), landmarks: [{ at: 0.15, kind: 'grave' }, { at: 0.86, kind: 'tree' }] };
const look = { goo: q.get('goo') || '#8cff1a', fence: q.get('fence') || 'iron', pumpkins: 5, grenade: q.get('grenade') || 'slime', dog: q.get('dog') === '1', lantern: q.get('lantern') === '1', gentle: q.get('gentle') === '1' };
const wave = { street: { id: roadTo === 3 ? 'pumpkin-hill' : 'maple', name: roadTo === 3 ? 'Pumpkin Hill' : 'Maple Street', weather: q.get('weather') || 'bats' }, number: num('wave', 1), zombies: items, big: q.get('big') === '1', final: q.get('final') === '1' };
if (q.get('live') != null) wave.live = num('live', 2);
const stats = { radius: tol, power: num('power', 1) };
const auto = q.get('auto') === '1';

// ---- simple WebAudio feel sounds (the real app owns audio; these are hooks on the 'sound' events) ----
let ac = null;
const mute = q.get('sound') === '0';
function beep(freq, dur, type = 'sine', gain = 0.3, slide = 0) {
  if (mute) return;
  try {
    ac ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
    g.gain.setValueAtTime(gain, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch (_) { /* no audio */ }
}
function noise(dur, gain = 0.25) {
  if (mute) return;
  try {
    ac ||= new (window.AudioContext || window.webkitAudioContext)();
    const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900;
    s.buffer = buf; g.gain.value = gain; s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
  } catch (_) { /* no audio */ }
}
const SFX = {
  toss: () => beep(500, 0.12, 'triangle', 0.15, 300),
  boing: (v) => beep(220, 0.18, 'square', 0.12 * v, 260),
  thunkBig: () => { beep(90, 0.35, 'sine', 0.6, -50); noise(0.25, 0.4); },
  thunk: () => { beep(110, 0.25, 'sine', 0.45, -40); noise(0.15, 0.25); },
  thunkSmall: () => { beep(140, 0.15, 'sine', 0.25, -30); },
  plop: () => beep(300, 0.1, 'sine', 0.2, -200),
  splat: () => noise(0.18, 0.2),
  cure: () => { beep(523, 0.12, 'triangle', 0.2); setTimeout(() => beep(659, 0.12, 'triangle', 0.2), 110); setTimeout(() => beep(784, 0.2, 'triangle', 0.2), 220); },
  knock: () => { beep(180, 0.06, 'square', 0.15); setTimeout(() => beep(180, 0.06, 'square', 0.15), 140); setTimeout(() => beep(180, 0.06, 'square', 0.15), 280); },
  pumpkin: () => beep(330, 0.2, 'triangle', 0.15, -120),
  bigWave: () => beep(196, 0.6, 'sawtooth', 0.12, 60),
  finalWave: () => beep(147, 0.8, 'sawtooth', 0.14, 100),
  calm: () => beep(392, 0.8, 'sine', 0.12),
  waveEnd: () => { beep(523, 0.2, 'triangle', 0.15); setTimeout(() => beep(784, 0.4, 'triangle', 0.15), 200); },
  lava: () => { beep(70, 0.4, 'sawtooth', 0.3, -30); noise(0.3, 0.3); },
  frost: () => beep(1200, 0.3, 'sine', 0.15, 600),
  shatter: () => { noise(0.12, 0.3); beep(1600, 0.15, 'triangle', 0.12, -800); },
  disco: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'square', 0.1), i * 90)); },
  combo: (v) => beep(440 + 120 * v, 0.15, 'triangle', 0.15, 200),
  mega: () => { beep(60, 0.6, 'sawtooth', 0.35, -20); noise(0.5, 0.4); },
  bossStomp: () => { beep(55, 0.5, 'sine', 0.5, -15); noise(0.2, 0.3); },
  bossHit: () => { beep(130, 0.3, 'square', 0.2, -60); noise(0.15, 0.2); },
  fireworks: () => { [0, 200, 420, 600].forEach((d) => setTimeout(() => { noise(0.15, 0.25); beep(900, 0.2, 'triangle', 0.1, 300); }, d)); },
  mutter: () => beep(150, 0.12, 'sawtooth', 0.05, -30),
  bark: () => { beep(420, 0.08, 'square', 0.15, -100); setTimeout(() => beep(400, 0.08, 'square', 0.15, -100), 120); },
};

// ---- the harness ----
const ff = (window.__ff = { game: null, events: [], finished: null, restart: null, items, road, wave, look, stats });
const logLines = [];
let timers = [];
function onEvent(evt) {
  ff.events.push(evt);
  if (evt.type === 'sound') { const f = SFX[evt.name]; if (f) f(evt.vol == null ? 1 : evt.vol); return; }
  if (evt.type === 'target') $('call').innerHTML = `${evt.item.show}<small>${evt.item.say}${evt.item.attempt > 1 ? ' · try ' + evt.item.attempt : ''}${evt.item.hint ? ' · hint: ' + evt.item.hint : ''}</small>`;
  if (evt.type === 'throw') {
    const it = ff.game.getState().target;
    $('call').innerHTML = `${evt.result.toUpperCase()} · ${evt.close} % close<small>${evt.item.show} = ${evt.item.target.toFixed(3)} · aimed ${evt.aimed.toFixed(3)} · err ${evt.err >= 0 ? '+' : ''}${evt.err.toFixed(3)} · PAE ${evt.pae} %${evt.hint ? ' · next hint: ' + evt.hint : ''}</small>`;
  }
  if (evt.type === 'calm') $('call').innerHTML = `All quiet<small>the street is calm</small>`;
  if (evt.type === 'waveEnd') {
    ff.finished = evt;
    const s = evt, c = s.cash;
    $('resText').textContent =
      `street     ${s.streetName} wave ${s.number}${s.big ? ' BIG' : ''}${s.final ? ' FINAL' : ''}${s.stopped ? ' (stopped)' : ''}\n` +
      `cured      ${s.cured}   reached ${s.reached}   throws ${s.throws}\n` +
      `accuracy   ${s.accuracy} %   mean PAE ${s.pae} %   bulls ${s.bulls}   hits ${s.hits}   near ${s.nears}   miss ${s.misses}\n` +
      `cash       cure ${c.cure} + bull ${c.bull} + effort ${c.effort} + final ${c.final} = $${c.total}\n` +
      `pumpkins   ${s.pumpkins} left (${s.pumpkinsTaken} taken)   ${s.durationSec} s\n` +
      s.results.map((r) => `  ${r.show.padEnd(6)} ${(r.result || '-').padEnd(5)} ${r.attempts}x  pae ${r.pae == null ? '-' : r.pae}${r.cured ? ' cured' : ''}${r.reached ? ' reached' : ''}`).join('\n');
    $('results').style.display = 'block';
  }
  const { type, ...rest } = evt;
  if (type !== 'aim') {
    const short = type === 'waveEnd' ? `cured ${rest.cured} reached ${rest.reached} $${rest.cash.total}` : JSON.stringify(rest, (k, v) => (k === 'item' && v && typeof v === 'object' ? v.show : typeof v === 'number' ? Math.round(v * 1000) / 1000 : v));
    logLines.unshift(type + ' ' + short);
    logLines.length = Math.min(logLines.length, 10);
    $('log').textContent = logLines.join('\n');
  }
}

const game = (ff.game = createGame($('c'), { onEvent, simSpeed: num('sim', 1), reducedMotion: q.get('rm') === '1' }));
let aim = 0.5;
function restart() {
  for (const t of timers) clearTimeout(t);
  timers = [];
  ff.events.length = 0;
  ff.finished = null;
  $('results').style.display = 'none';
  game.start({ road, wave, look, stats, seed: num('seed', 7) });
  aim = 0.5;
  game.setAim(aim);
}
ff.restart = restart;
restart();

// ---- input: drag along the road (x -> x01 via roadPx), keys ----
const canvas = $('c');
let dragging = false;
function aimFromX(px) {
  const s = game.getState();
  aim = Math.max(0, Math.min(1, (px - s.roadPx.left) / (s.roadPx.right - s.roadPx.left)));
  game.setAim(aim);
}
canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); canvas.setPointerCapture(e.pointerId); dragging = true; aimFromX(e.clientX); });
canvas.addEventListener('pointermove', (e) => { if (dragging) aimFromX(e.clientX); });
const up = (e) => { if (!dragging) return; dragging = false; aimFromX(e.clientX); game.throw(); };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', () => { dragging = false; });
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const step = e.shiftKey ? 0.05 : 0.01;
    aim = Math.max(0, Math.min(1, aim + (e.key === 'ArrowLeft' ? -step : step)));
    game.setAim(aim); e.preventDefault();
  }
  if (e.key === ' ') { game.throw(); e.preventDefault(); }
  if (e.key === 'r') restart();
  if (e.key === 'f') { // focus the next live zombie
    const live = game.getState().live.filter((z) => !z.cured && z.state === 'walk' || z.state === 'knock');
    const i = live.findIndex((z) => z.focus);
    if (live.length) game.setFocus(live[(i + 1) % live.length].item);
  }
  if (e.key === 'p') { if (window.__paused) game.resume(); else game.pause(); window.__paused = !window.__paused; }
  if (e.key === 's') game.stop();
});
$('restartBtn').onclick = restart;
$('retry').onclick = restart;
if (auto) setInterval(() => { const s = game.getState(); if (s.phase === 'wave' && s.target) game.throwAt((s.target.target - s.road.from) / (s.road.to - s.road.from)); }, 2400);

// ---- debug readout ----
function readout() {
  const s = game.getState();
  $('state').textContent = `${wave.street.name} wave ${s.number}${s.big ? ' BIG' : ''}${s.final ? ' FINAL' : ''}  road ${s.road.from}–${s.road.to}\n` +
    `phase ${s.phase}${s.inFlight ? ' (in flight)' : ''}   t ${s.timeSec.toFixed(1)} s\n` +
    `aim   ${s.aim == null ? '-' : s.aim.toFixed(3)} → ${s.aimValue == null ? '-' : s.aimValue.toFixed(3)}\n` +
    `target ${s.target ? s.target.show + ' (' + s.target.target.toFixed(3) + ') try ' + s.target.attempt + (s.target.hint ? ' hint ' + s.target.hint : '') : '-'}\n` +
    `cured ${s.cured}/${s.total}  reached ${s.reached}  pumpkins ${s.pumpkins}\n` +
    `throws ${s.throws}  bulls ${s.bulls}  hits ${s.hits}  acc ${s.accuracy} %  $${s.cash}\n` +
    `live  ${s.live.map((z) => `${z.look}/${z.hat} ${z.state} ${(z.p * 100).toFixed(0)}%`).join(' · ') || '-'}\n` +
    (s.lastThrow ? `last  ${s.lastThrow.result} ${s.lastThrow.close} % close` : '');
  requestAnimationFrame(readout);
}
readout();
</script>
</body>
</html>
