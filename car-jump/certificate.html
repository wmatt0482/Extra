<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Friday Test certificate</title>
<link rel="icon" href="icons/favicon.png">
<style>
/* A print-styled page: system fonts only, no images, no links off this origin. The buttons are screen only. */
:root { color-scheme: light; --ink: #1c2350; --gold: #b98200; --tier: #c8920a; --tier-soft: #fff6d6; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #e9ecf8; color: var(--ink); font: 16px/1.4 Georgia, 'Times New Roman', serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
#cert-root { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px 28px; }
.cert { position: relative; width: min(100%, 720px); aspect-ratio: 8.5 / 11; max-height: none; background: #fffdf6; border: 10px double var(--tier); border-radius: 6px;
  padding: 28px 30px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; box-shadow: 0 8px 30px rgba(20, 30, 90, .25); }
.cert.tier-silver { --tier: #8a96b0; --tier-soft: #eef2fb; }
.cert.tier-bronze { --tier: #b8692a; --tier-soft: #fbeadb; }
.cert.tier-brave { --tier: #1496b8; --tier-soft: #def6fc; }
.cert-brand { font: 700 15px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: .28em; text-transform: uppercase; color: var(--tier); }
.cert-title { margin: 8px 0 0; font: 700 clamp(26px, 6.4vw, 40px)/1.1 Georgia, 'Times New Roman', serif; letter-spacing: .02em; }
.cert-sub { margin: 10px 0 0; font-style: italic; color: #4a5486; }
.cert-name { margin: 2px 0 0; padding: 0 20px 4px; border-bottom: 3px solid var(--tier); font: 700 clamp(34px, 9vw, 58px)/1.1 Georgia, 'Times New Roman', serif; max-width: 100%; overflow-wrap: anywhere; }
.cert-art { width: clamp(90px, 22vw, 150px); margin: 10px 0 0; }
.cert-art svg { width: 100%; display: block; }
.cert-ribbon { margin-top: 2px; padding: 6px 22px; border-radius: 999px; background: var(--tier-soft); border: 3px solid var(--tier); font: 700 clamp(15px, 3.6vw, 20px)/1 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: .06em; text-transform: uppercase; }
.cert-improved { background: #ece6ff; border-color: #6a4fd6; }
.cert-line { margin: 10px 0 0; font-size: clamp(17px, 3.8vw, 22px); max-width: 30em; }
.cert-line2 { margin-top: 4px; font-size: clamp(14px, 3vw, 17px); color: #3b4478; }
.cert-meta { margin: 8px 0 0; font: 600 14px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #4a5486; }
.cert-practice { margin: 2px 0 0; font: 14px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #4a5486; max-width: 32em; }
.cert-foot { margin-top: auto; padding-top: 12px; font-style: italic; color: #4a5486; }
.cert-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: min(100%, 720px); }
.cert-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink);
  font: 700 16px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; text-decoration: none; cursor: pointer; }
.cert-print { background: #ffcf1a; }
.cert-btn:focus-visible { outline: 3px solid #22d3ff; outline-offset: 2px; }
.cert-missing { max-width: 520px; padding: 24px; background: #fff; border: 4px solid var(--ink); border-radius: 14px; text-align: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
.cert-missing h1 { font-size: 22px; margin: 0 0 8px; }
@page { size: auto; margin: 10mm; }
@media print {
  html, body { background: #fff; }
  #cert-root { padding: 0; gap: 0; }
  .cert { width: 100%; max-width: none; aspect-ratio: auto; height: 250mm; box-shadow: none; border-radius: 0; break-inside: avoid; }
  .cert { justify-content: center; gap: 4mm; padding: 14mm 16mm 12mm; }
  .cert-brand { font-size: 12pt; } .cert-title { font-size: 34pt; margin-top: 4mm; } .cert-sub { font-size: 13pt; margin-top: 4mm; }
  .cert-name { font-size: 52pt; } .cert-art { width: 58mm; margin: 6mm 0 2mm; } .cert-ribbon { font-size: 15pt; padding: 3mm 9mm; }
  .cert-line { font-size: 17pt; margin-top: 5mm; } .cert-line2 { font-size: 13pt; } .cert-meta { font-size: 11pt; margin-top: 6mm; } .cert-practice { font-size: 11pt; }
  .cert-foot { margin-top: 10mm; padding-top: 0; font-size: 12pt; }
  .cert-bar, .cert-btn, button, a.cert-btn { display: none !important; }
}
</style>
</head>
<body>
<main id="cert-root" aria-live="polite"></main>
<script type="module" src="src/ui/certificate.js"></script>
</body>
</html>
