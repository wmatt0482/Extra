<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ramp Rage</title>
<meta name="description" content="Launch off giant ramps, flip, land, and smash everything in sight.">
<meta name="theme-color" content="#0d1230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ramp Rage">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap">
<style>
:root {
  --ink: #0d1230;          /* deep navy chrome */
  --ink-2: #151c45;
  --panel: #1b2357;
  --panel-2: #24307a;
  --line: #34418f;
  --text: #ffffff;
  --muted: #aab4ee;
  --dim: #6f7bc0;
  --accent: #ffcf1a;       /* arcade yellow */
  --accent-edge: #b98200;
  --accent-ink: #2a1a00;
  --hot: #ff3b5c;
  --hot-edge: #a8173a;
  --go: #2fd36b;
  --go-edge: #13803c;
  --cyan: #22d3ff;
  --cyan-edge: #0a7fa6;
  --violet: #8f6bff;
  --violet-edge: #4f33b5;
  --font-display: 'Bungee', 'Arial Black', 'Helvetica Neue', Impact, system-ui, sans-serif;
  --font-body: 'Rubik', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 16px;
  --r-sm: 11px;
  --edge: 5px;
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --pad-t: max(10px, var(--sat));
  --pad-r: max(14px, var(--sar));
  --pad-b: max(10px, var(--sab));
  --pad-l: max(14px, var(--sal));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--ink); color: var(--text); font-family: var(--font-body); font-weight: 500;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
}
body { position: fixed; inset: 0; touch-action: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
#app { position: fixed; inset: 0; overflow: hidden; }
#stage { position: absolute; inset: 0; touch-action: none; }
#game { display: block; width: 100%; height: 100%; touch-action: none; }

/* ---------- menu backdrop: arcade sunset + ramp silhouette (pure SVG, no images) ---------- */
#backdrop { position: absolute; inset: 0; background: linear-gradient(#2a1d78 0%, #7b2a8c 40%, #ff4f6d 68%, #ffb13d 100%); }
#backdrop svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#backdrop::after { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(8,10,35,.55)); }

/* ---------- shared pieces ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l); }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 52px; flex: none; }
.topbar h2 { flex: 1; margin: 0; font: 400 clamp(20px, 3.4vw, 28px)/1 var(--font-display); letter-spacing: .02em;
  text-shadow: 0 3px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cash-pill { display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 14px 0 8px; border-radius: 999px;
  background: var(--ink); border: 2px solid var(--line); font: 400 18px/1 var(--font-display); color: var(--accent); white-space: nowrap; }
.cash-pill .coin { width: 26px; height: 26px; }
.coin { display: inline-block; flex: none; width: 1.25em; height: 1.25em; vertical-align: -.28em; }

.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 20px; border-radius: var(--r); font: 400 18px/1 var(--font-display); letter-spacing: .02em;
  background: var(--panel-2); color: #fff; box-shadow: 0 var(--edge) 0 var(--ink), inset 0 -3px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.18);
  transform: translateY(0); transition: transform .06s, box-shadow .06s, filter .1s; white-space: nowrap; }
.btn:active, .btn.is-down { transform: translateY(calc(var(--edge) - 1px)); box-shadow: 0 1px 0 var(--ink), inset 0 -3px 0 rgba(0,0,0,.18); }
.btn[disabled] { filter: grayscale(.85) brightness(.75); cursor: default; }
.btn[disabled]:active { transform: none; box-shadow: 0 var(--edge) 0 var(--ink); }
.btn-yellow { background: var(--accent); color: var(--accent-ink); box-shadow: 0 var(--edge) 0 var(--accent-edge), inset 0 -3px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.5); }
.btn-yellow:active { box-shadow: 0 1px 0 var(--accent-edge); }
.btn-green { background: var(--go); color: #062a12; box-shadow: 0 var(--edge) 0 var(--go-edge), inset 0 -3px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.45); }
.btn-green:active { box-shadow: 0 1px 0 var(--go-edge); }
.btn-hot { background: var(--hot); box-shadow: 0 var(--edge) 0 var(--hot-edge), inset 0 -3px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.35); }
.btn-hot:active { box-shadow: 0 1px 0 var(--hot-edge); }
.btn-cyan { background: var(--cyan); color: #032634; box-shadow: 0 var(--edge) 0 var(--cyan-edge), inset 0 2px 0 rgba(255,255,255,.45); }
.btn-cyan:active { box-shadow: 0 1px 0 var(--cyan-edge); }
.btn-poor { background: var(--ink-2); color: var(--muted); box-shadow: 0 var(--edge) 0 #060918, inset 0 2px 0 rgba(255,255,255,.08); }
.btn-poor .coin { filter: grayscale(.6); }
.btn-big { min-height: 66px; font-size: 26px; padding: 0 34px; border-radius: 20px; --edge: 7px; }
.btn-sm { min-height: 44px; font-size: 15px; padding: 0 14px; border-radius: var(--r-sm); --edge: 4px; }
.icon-btn { width: 48px; height: 48px; min-height: 48px; padding: 0; border-radius: 14px; flex: none; }
.icon-btn svg { width: 24px; height: 24px; }
.btn svg { flex: none; width: 22px; height: 22px; }
[data-icon] { display: inline-flex; align-items: center; justify-content: center; }
.badge { position: absolute; top: -8px; right: -8px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px;
  background: var(--hot); color: #fff; font: 400 13px/24px var(--font-display); text-align: center; box-shadow: 0 2px 0 var(--hot-edge); }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: var(--r); box-shadow: 0 6px 0 rgba(5,7,25,.55); }
.scroll { overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }
.muted { color: var(--muted); }
.display { font-family: var(--font-display); font-weight: 400; }
/* Bungee is caps-only; uppercase keeps the look identical if the webfont has not loaded (offline first run) */
.btn, .ctl, .topbar h2, .logo, .car-name, .up-name, .track-name, .track-num, .results-head h2, .record, .callout, .sheet-head h3,
.daily-goal, .toast, .stat b, .cleared, .hud-num small, .done-chip, .reward, .pay tr.total td:first-child { text-transform: uppercase; }
.up-name small, .stat b small { text-transform: none; }

/* ---------- title ---------- */
#screen-title { align-items: center; justify-content: center; text-align: center; }
#screen-title .topbar { position: absolute; top: var(--pad-t); right: var(--pad-r); left: var(--pad-l); justify-content: flex-end; }
.logo { margin: 0 0 6px; font: 400 clamp(54px, 11vmin + 2vw, 104px)/.86 var(--font-display); color: var(--accent); transform: rotate(-4deg) skewX(-6deg);
  text-shadow: 0 4px 0 #e0532a, 0 8px 0 var(--ink), 0 12px 24px rgba(0,0,0,.45); letter-spacing: .01em; }
.logo span { display: block; color: #fff; text-shadow: 0 4px 0 var(--hot), 0 8px 0 var(--ink), 0 12px 24px rgba(0,0,0,.45); }
.tagline { margin: 10px 0 18px; font-weight: 700; font-size: 15px; color: #ffe9b0; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
.title-actions { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.menu-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.menu-row .btn { min-width: 116px; font-size: 15px; }
.menu-row .btn svg { width: 22px; height: 22px; }

/* ---------- garage ---------- */
.garage-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 14px; padding-top: 6px; }
.car-card { display: flex; flex-direction: column; min-height: 0; padding: 10px 12px 12px; position: relative; }
.car-stage { position: relative; flex: 1; min-height: 96px; }
.car-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; }
.car-nav { position: absolute; top: 50%; transform: translateY(-50%); }
.car-nav.prev { left: -4px; } .car-nav.next { right: -4px; }
.car-nav:active { transform: translateY(calc(-50% + 3px)); }
.car-meta { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.car-name { margin: 0; font: 400 22px/1.05 var(--font-display); }
.car-tag { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.tier { display: flex; gap: 3px; margin-bottom: 4px; flex: none; }
.tier i { width: 10px; height: 10px; border-radius: 3px; background: var(--line); transform: skewX(-12deg); }
.tier i.on { background: var(--accent); }
.dots { display: flex; justify-content: center; gap: 6px; margin: 6px 0 8px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: #fff; width: 20px; border-radius: 4px; }
.car-actions { display: flex; gap: 10px; margin-top: 10px; }
.car-actions .btn { flex: 1 1 0; min-width: 0; padding: 0 12px; }
#btn-race { flex-grow: 1.15; }
.btn-selected, .btn-selected[disabled] { background: transparent; color: var(--go); box-shadow: inset 0 0 0 2px var(--go); filter: none; }
.btn-selected[disabled]:active { box-shadow: inset 0 0 0 2px var(--go); }
.upgrades { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.upgrades .up-row { flex: 1 1 0; min-height: 0; }
.up-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 8px 7px 8px; }
.up-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--ink-2); color: var(--accent); }
.up-icon svg { width: 26px; height: 26px; }
.up-name { display: flex; align-items: baseline; gap: 8px; font: 400 15px/1 var(--font-display); }
.up-name small { font: 700 12px/1 var(--font-body); color: var(--muted); }
.pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-top: 7px; }
.pips i { height: 9px; border-radius: 3px; background: var(--ink-2); transform: skewX(-14deg); }
.pips i.on { background: var(--go); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
.up-row .btn { min-width: 108px; }
.up-row .btn .coin { width: 18px; height: 18px; }

/* ---------- tracks ---------- */
.tracks-body { flex: 1; min-height: 0; padding-top: 8px; }
.track-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; height: 100%; }
.track-card { position: relative; display: flex; flex-direction: column; text-align: left; overflow: hidden; padding: 0; min-height: 0;
  transition: transform .06s, box-shadow .06s; }
.track-card:active:not(.locked) { transform: translateY(4px); box-shadow: 0 2px 0 rgba(5,7,25,.55); }
.track-art { position: relative; flex: 1; min-height: 70px; }
.track-art > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.track-info { padding: 8px 10px 10px; }
.track-num { font: 400 11px/1 var(--font-display); color: var(--accent); }
.track-name { margin: 3px 0 6px; font: 400 15px/1.05 var(--font-display); min-height: 2.1em; display: flex; align-items: flex-end; }
.track-stat { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); gap: 6px; }
.track-stat b { color: #fff; font-weight: 800; }
.track-bar { height: 7px; margin-top: 7px; border-radius: 4px; background: var(--ink-2); overflow: hidden; }
.track-bar i { display: block; height: 100%; background: var(--go); border-radius: 4px; }
.track-card.locked .track-art > svg { filter: grayscale(1) brightness(.45); }
.track-card.locked .track-info { opacity: .55; }
.lock { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 6px; text-align: center; padding: 8px;
  font: 700 12px/1.25 var(--font-body); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.lock svg { width: 30px; height: 30px; color: var(--accent); filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
.track-card .cleared { position: absolute; top: 8px; right: 8px; padding: 4px 7px; border-radius: 7px; background: var(--go); color: #062a12;
  font: 400 10px/1 var(--font-display); box-shadow: 0 2px 0 var(--go-edge); }

/* ---------- HUD + controls ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; padding: var(--pad-t) var(--pad-r) 0 var(--pad-l); }
.hud-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 10px; }
.hud-box { display: inline-flex; flex-direction: column; padding: 6px 12px 8px; border-radius: 14px; background: rgba(13,18,48,.72);
  border: 2px solid rgba(255,255,255,.12); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.hud-num { font: 400 30px/1 var(--font-display); font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
.hud-num small { font-size: 14px; margin-left: 3px; color: var(--muted); }
.hud-label { font: 800 10px/1 var(--font-body); letter-spacing: .12em; color: var(--muted); margin-bottom: 3px; }
.finish-bar { position: relative; width: 150px; height: 8px; margin-top: 6px; border-radius: 4px; background: rgba(255,255,255,.15); }
.finish-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
.finish-bar b { position: absolute; right: -4px; top: -5px; width: 4px; height: 18px; background: repeating-linear-gradient(#fff 0 4px, #111 4px 8px); border-radius: 1px; }
.hud-left { justify-self: start; }
.hud-mid { justify-self: center; }
.hud-mid .hud-num { color: var(--accent); }
.hud-right { justify-self: end; display: flex; gap: 10px; align-items: flex-start; }
.hud-right .hud-box { align-items: flex-end; min-width: 120px; }
.nitro-bar { width: 100%; height: 8px; margin-top: 6px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
.nitro-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--cyan), #9ef0ff); transform-origin: left; }
#btn-pause { pointer-events: auto; }
#toasts { position: absolute; left: 50%; top: calc(var(--pad-t) + 6px); z-index: 20; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.in-run #toasts { top: calc(var(--pad-t) + 84px); }
.toast { padding: 8px 14px; border-radius: 12px; background: var(--ink); border: 2px solid var(--accent); font: 400 14px/1 var(--font-display); color: var(--accent);
  box-shadow: 0 4px 0 rgba(0,0,0,.4); animation: toast 2.6s ease forwards; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-10px) scale(.9); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-6px); } }

#controls { position: absolute; left: 0; right: 0; bottom: 0; height: 0; pointer-events: none; }
.ctl { position: absolute; pointer-events: auto; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border-radius: 26px; font: 400 18px/1 var(--font-display); color: #fff; letter-spacing: .03em; overflow: hidden;
  --edge: 7px; transition: transform .05s, box-shadow .05s; -webkit-user-select: none; user-select: none; }
.ctl small { font: 800 10px/1 var(--font-body); letter-spacing: .1em; opacity: .85; text-transform: uppercase; }
.ctl svg { width: 30px; height: 30px; }
.ctl > * { position: relative; }
.ctl.is-down { transform: translateY(5px); }
#ctl-brake { left: var(--pad-l); bottom: calc(var(--pad-b) + 4px); width: 112px; height: 112px; background: var(--hot); box-shadow: 0 var(--edge) 0 var(--hot-edge), inset 0 3px 0 rgba(255,255,255,.3); }
#ctl-brake.is-down { box-shadow: 0 2px 0 var(--hot-edge); }
#ctl-gas { right: var(--pad-r); bottom: calc(var(--pad-b) + 4px); width: 124px; height: 124px; background: var(--go); color: #062a12; box-shadow: 0 var(--edge) 0 var(--go-edge), inset 0 3px 0 rgba(255,255,255,.4); }
#ctl-gas.is-down { box-shadow: 0 2px 0 var(--go-edge); }
#ctl-nitro { right: calc(var(--pad-r) + 18px); bottom: calc(var(--pad-b) + 148px); width: 92px; height: 92px; border-radius: 50%; background: #0b3a52; color: #fff;
  box-shadow: 0 var(--edge) 0 #05202e, inset 0 3px 0 rgba(255,255,255,.25); }
#ctl-nitro.is-down { box-shadow: 0 2px 0 #05202e; }
#ctl-nitro .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: linear-gradient(var(--cyan), #0aa6d6); transform-origin: bottom; transition: transform .1s linear; }
#ctl-nitro.empty { color: var(--dim); }

/* ---------- results ---------- */
#screen-results { background: rgba(9,12,36,.78); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.results-head { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 44px; flex: none; }
.results-head h2 { margin: 0; font: 400 28px/1 var(--font-display); color: var(--accent); text-shadow: 0 3px 0 var(--ink); transform: rotate(-2deg); }
.results-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 14px; padding: 8px 0 12px; }
.res-main { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.res-dist { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.res-dist .big { font: 400 46px/1 var(--font-display); }
.res-dist .big small { font-size: 20px; color: var(--muted); margin-left: 4px; }
.record { display: inline-block; padding: 7px 10px; border-radius: 10px; background: var(--hot); font: 400 13px/1 var(--font-display); transform: rotate(-4deg);
  box-shadow: 0 3px 0 var(--hot-edge); animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: rotate(-4deg) scale(1.08); } }
.res-sub { font-size: 13px; color: var(--muted); font-weight: 700; margin-top: -4px; }
.stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 8px 10px; border-radius: 12px; background: var(--ink-2); }
.stat b { display: block; font: 400 18px/1.1 var(--font-display); white-space: nowrap; }
.stat b small { font-size: .62em; color: var(--muted); margin-left: 2px; }
.stat span { font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.res-pay { padding: 10px 14px; display: flex; flex-direction: column; min-height: 0; }
.pay { width: 100%; border-collapse: collapse; font-size: 15px; }
.pay td { padding: 5px 0; border-bottom: 1px dashed var(--line); }
.pay td:last-child { text-align: right; font: 400 16px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.pay tr.total td { border-bottom: 0; padding-top: 9px; font-size: 18px; }
.pay tr.total td:last-child { font-size: 24px; color: var(--accent); }
.pay tr.extra td:last-child { color: var(--go); }
.pay .hint { font-size: 12px; color: var(--muted); font-weight: 700; }
.res-callouts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.callout { padding: 6px 10px; border-radius: 10px; background: var(--go); color: #062a12; font: 400 12px/1.1 var(--font-display); box-shadow: 0 3px 0 var(--go-edge); }
.callout.cyan { background: var(--cyan); color: #032634; box-shadow: 0 3px 0 var(--cyan-edge); }
.results-foot { display: flex; justify-content: center; gap: 12px; flex: none; }
.results-foot .btn { min-width: 150px; }

/* ---------- modal panels ---------- */
.modal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(6,8,28,.66); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l); animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: min(600px, 100%); max-height: 100%; display: flex; flex-direction: column; padding: 12px 16px 16px; animation: pop .18s cubic-bezier(.2,1.4,.5,1); }
@keyframes pop { from { transform: scale(.92); } }
.sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex: none; }
.sheet-head h3 { flex: 1; margin: 0; font: 400 22px/1 var(--font-display); }
.sheet-head h3 svg { width: 22px; height: 22px; vertical-align: -3px; margin-right: 6px; color: var(--accent); }
.sheet-body { min-height: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .label { font-weight: 700; }
.row .sub { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 2px; }
.row .val { font: 400 17px/1 var(--font-display); text-align: right; white-space: nowrap; }
.goal-icon { width: 44px; height: 44px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--ink-2); color: var(--accent); }
.goal-icon svg { width: 24px; height: 24px; }
.progress { height: 8px; border-radius: 4px; background: var(--ink-2); margin-top: 6px; overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 4px; background: var(--go); }
.reward { display: inline-flex; align-items: center; gap: 5px; font: 400 15px/1 var(--font-display); color: var(--accent); white-space: nowrap; }
.toggle { position: relative; width: 76px; height: 46px; flex: none; }
.toggle::before { content: ''; position: absolute; inset: 5px 4px; border-radius: 999px; background: var(--ink-2); border: 2px solid var(--line); transition: background .15s; }
.toggle::after { content: ''; position: absolute; top: 10px; left: 9px; width: 26px; height: 26px; border-radius: 50%; background: var(--dim); transition: transform .15s, background .15s; }
.toggle[aria-checked="true"]::before { background: var(--go); border-color: var(--go-edge); }
.toggle[aria-checked="true"]::after { transform: translateX(32px); background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.confirm { margin-top: 10px; padding: 12px; border-radius: 12px; background: rgba(255,59,92,.14); border: 2px solid var(--hot); }
.confirm p { margin: 0 0 10px; font-weight: 700; }
.confirm .btns { display: flex; gap: 10px; }
.daily-hero { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; align-items: center; }
.daily-hero canvas { width: 150px; height: 84px; border-radius: 12px; background: var(--ink-2); }
.daily-goal { font: 400 20px/1.15 var(--font-display); color: var(--accent); margin: 2px 0 6px; }
.daily-meta { font-size: 13px; color: var(--muted); font-weight: 700; line-height: 1.5; }
.daily-meta b { color: #fff; }
.daily-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.done-chip { padding: 8px 12px; border-radius: 10px; background: var(--go); color: #062a12; font: 400 14px/1 var(--font-display); box-shadow: 0 3px 0 var(--go-edge); }
.pause-actions { display: flex; flex-direction: column; gap: 14px; padding: 6px 0 4px; }
.pause-actions .btn { width: 100%; }
.pause-toggles { display: flex; gap: 10px; }
.pause-toggles .btn { flex: 1; }
.ver { margin-top: 10px; font-size: 11px; color: var(--dim); text-align: center; }

/* ---------- portrait: same flow, stacked ---------- */
@media (orientation: portrait) {
  .title-actions { width: min(100%, 360px); }
  #btn-play { width: 100%; }
  .menu-row { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
  .menu-row .btn { min-width: 0; }
  .garage-body { grid-template-columns: 1fr; grid-template-rows: auto auto; overflow: auto; touch-action: pan-y; padding-bottom: 8px; }
  .car-stage { height: 150px; flex: none; }
  .upgrades .up-row { flex: none; }
  .track-grid { grid-template-columns: 1fr; height: auto; gap: 10px; }
  .tracks-body { overflow: auto; touch-action: pan-y; padding-bottom: 6px; }
  .track-card { flex-direction: row; min-height: 104px; }
  .track-art { flex: 0 0 120px; }
  .track-info { flex: 1; padding: 12px; }
  .track-name { min-height: 0; }
  .results-body { grid-template-columns: 1fr; overflow: auto; touch-action: pan-y; align-content: start; }
  .results-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; }
  .results-foot .btn { min-width: 0; padding: 0 10px; }
  #res-retry { grid-column: 1 / -1; grid-row: 1; min-height: 60px; font-size: 22px; }
  .results-foot:has(#res-next[hidden]) #res-garage { grid-column: 1 / -1; }
  .hud-top { grid-template-columns: 1fr auto; }
  .hud-mid { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
  .finish-bar { width: 120px; }
  .daily-hero { grid-template-columns: 1fr; }
  .daily-hero canvas { width: 100%; height: 110px; }
  .in-run #toasts { top: calc(var(--pad-t) + 150px); }
}
/* short landscape phones (iPhone SE/mini): tighten vertical rhythm */
@media (orientation: landscape) and (max-height: 400px) {
  .btn-big { min-height: 58px; font-size: 22px; }
  .menu-row .btn { min-height: 48px; }
  .up-row { padding: 5px 8px; }
  .up-icon { width: 40px; height: 40px; }
  .res-dist .big { font-size: 38px; }
  .stat { padding: 6px 8px; }
  .stat b { font-size: 16px; }
  .pay td { padding: 4px 0; }
  .ctl { --edge: 6px; }
  #ctl-brake { width: 104px; height: 104px; }
  #ctl-gas { width: 112px; height: 112px; }
  #ctl-nitro { width: 88px; height: 88px; bottom: calc(var(--pad-b) + 132px); right: calc(var(--pad-r) + 12px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
.reduced-motion .record, .reduced-motion .toast, .reduced-motion .sheet { animation: none; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game" aria-label="Ramp Rage game"></canvas></div>

  <div id="backdrop" aria-hidden="true">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff27a"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient>
        <clipPath id="sunclip"><circle cx="1080" cy="560" r="230"/></clipPath>
      </defs>
      <g clip-path="url(#sunclip)">
        <rect x="840" y="320" width="480" height="480" fill="url(#sun)"/>
        <g fill="#ff5a6a" opacity=".9"><rect x="840" y="610" width="480" height="12"/><rect x="840" y="650" width="480" height="18"/><rect x="840" y="696" width="480" height="24"/><rect x="840" y="748" width="480" height="30"/></g>
      </g>
      <path d="M0 700 L120 610 L230 660 L360 560 L470 640 L600 590 L760 680 L900 620 L1040 690 L1200 600 L1340 660 L1480 590 L1600 640 L1600 900 L0 900 Z" fill="#43206e" opacity=".85"/>
      <path d="M0 760 L180 700 L340 740 L520 690 L700 750 L880 715 L1060 770 L1260 720 L1440 760 L1600 730 L1600 900 L0 900 Z" fill="#2a1757"/>
      <!-- ramp -->
      <path d="M-20 300 C 140 300, 330 520, 520 690 L 560 678 L 560 900 L -20 900 Z" fill="#0d1230"/>
      <path d="M-20 300 C 140 300, 330 520, 520 690 L 560 678" fill="none" stroke="#ffcf1a" stroke-width="10" stroke-linecap="round"/>
      <g stroke="#1b2357" stroke-width="10"><line x1="80" y1="330" x2="80" y2="900"/><line x1="220" y1="410" x2="220" y2="900"/><line x1="360" y1="540" x2="360" y2="900"/><line x1="480" y1="650" x2="480" y2="900"/></g>
      <!-- landing ground -->
      <path d="M760 820 C 1000 790, 1250 800, 1600 780 L 1600 900 L 760 900 Z" fill="#0d1230"/>
      <!-- car coming in to land -->
      <g transform="translate(1300 650) rotate(10)">
        <path d="M-95 18 L95 18 L98 -6 L60 -14 L36 -46 L-44 -48 L-80 -22 L-98 -12 Z" fill="#0d1230"/>
        <path d="M30 -16 L18 -40 L-36 -42 L-58 -18 Z" fill="#3a2a8f"/>
        <circle cx="-62" cy="22" r="20" fill="#0d1230"/><circle cx="62" cy="22" r="20" fill="#0d1230"/>
      </g>
      <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".5"><line x1="1170" y1="590" x2="1080" y2="572"/><line x1="1160" y1="630" x2="1090" y2="616"/><line x1="1180" y1="550" x2="1110" y2="536"/></g>
    </svg>
  </div>

  <!-- ===== Title ===== -->
  <section class="screen" id="screen-title" data-screen="title">
    <div class="topbar"><span class="cash-pill" data-cash></span></div>
    <h1 class="logo">Ramp<span>Rage</span></h1>
    <p class="tagline">Launch. Flip. Land it. Smash everything.</p>
    <div class="title-actions">
      <button class="btn btn-yellow btn-big" id="btn-play" data-sfx>Play</button>
      <div class="menu-row">
        <button class="btn" data-open="daily" data-sfx><span data-icon="calendar"></span>Daily<span class="badge" id="badge-daily" hidden>!</span></button>
        <button class="btn" data-open="goals" data-sfx><span data-icon="target"></span>Goals<span class="badge" id="badge-goals" hidden></span></button>
        <button class="btn" data-open="records" data-sfx><span data-icon="trophy"></span>Records</button>
        <button class="btn" data-open="settings" data-sfx><span data-icon="gear"></span>Settings</button>
      </div>
    </div>
  </section>

  <!-- ===== Garage ===== -->
  <section class="screen" id="screen-garage" data-screen="garage" hidden>
    <div class="topbar">
      <button class="btn icon-btn" data-back="title" aria-label="Back" data-sfx><span data-icon="back"></span></button>
      <h2>Garage</h2>
      <span class="cash-pill" data-cash></span>
    </div>
    <div class="garage-body">
      <div class="card car-card">
        <div class="car-stage">
          <canvas id="car-preview" aria-label="Car preview"></canvas>
          <button class="btn icon-btn car-nav prev" id="car-prev" aria-label="Previous car" data-sfx><span data-icon="left"></span></button>
          <button class="btn icon-btn car-nav next" id="car-next" aria-label="Next car" data-sfx><span data-icon="right"></span></button>
        </div>
        <div class="dots" id="car-dots"></div>
        <div class="car-meta">
          <div style="min-width:0"><h3 class="car-name" id="car-name"></h3><p class="car-tag" id="car-tag"></p></div>
          <div class="tier" id="car-tier" aria-label="Tier"></div>
        </div>
        <div class="car-actions">
          <button class="btn" id="car-action" data-sfx></button>
          <button class="btn btn-green" id="btn-race" data-sfx>Race<span data-icon="right"></span></button>
        </div>
      </div>
      <div class="upgrades" id="upgrades"></div>
    </div>
  </section>

  <!-- ===== Track select ===== -->
  <section class="screen" id="screen-tracks" data-screen="tracks" hidden>
    <div class="topbar">
      <button class="btn icon-btn" data-back="garage" aria-label="Back" data-sfx><span data-icon="back"></span></button>
      <h2>Pick a track</h2>
      <span class="cash-pill" data-cash></span>
    </div>
    <div class="tracks-body"><div class="track-grid" id="track-grid"></div></div>
  </section>

  <!-- ===== Run HUD ===== -->
  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-left hud-box">
        <div class="hud-num"><span id="hud-distance">0</span><small>m</small></div>
        <div class="finish-bar" aria-hidden="true"><i id="hud-finish"></i><b></b></div>
      </div>
      <div class="hud-mid hud-box"><div class="hud-label">RUN CASH</div><div class="hud-num">$<span id="hud-cash">0</span></div></div>
      <div class="hud-right">
        <div class="hud-box">
          <div class="hud-num"><span id="hud-speed">0</span><small>km/h</small></div>
          <div class="nitro-bar" aria-label="Nitro"><i id="hud-nitro"></i></div>
        </div>
        <button class="btn icon-btn" id="btn-pause" aria-label="Pause"><span data-icon="pause"></span></button>
      </div>
    </div>
    <div id="toasts"></div>
  </div>
  <div id="controls" hidden>
    <button class="ctl" id="ctl-brake" data-ctl="brake" aria-label="Brake / back flip"><span data-icon="left"></span><span>Brake</span><small>back flip</small></button>
    <button class="ctl" id="ctl-nitro" data-ctl="nitro" aria-label="Nitro"><span class="fill" id="ctl-nitro-fill"></span><span data-icon="flame"></span><span>Nitro</span></button>
    <button class="ctl" id="ctl-gas" data-ctl="gas" aria-label="Gas / front flip"><span data-icon="right"></span><span>Gas</span><small>front flip</small></button>
  </div>

  <!-- ===== Results ===== -->
  <section class="screen" id="screen-results" data-screen="results" hidden>
    <div class="results-head"><h2 id="res-title">Run over</h2></div>
    <div class="results-body">
      <div class="card res-main">
        <div class="res-dist"><div class="big"><span id="res-distance">0</span><small>m</small></div><span class="record" id="res-record" hidden>New record!</span></div>
        <div class="res-sub" id="res-sub"></div>
        <div class="stat-grid" id="res-stats"></div>
      </div>
      <div class="card res-pay">
        <table class="pay" id="res-pay"></table>
        <div class="res-callouts" id="res-callouts"></div>
      </div>
    </div>
    <div class="results-foot">
      <button class="btn" id="res-garage" data-sfx><span data-icon="wrench"></span>Garage</button>
      <button class="btn btn-yellow" id="res-retry" data-sfx><span data-icon="retry"></span>Retry</button>
      <button class="btn btn-green" id="res-next" data-sfx>Next track<span data-icon="right"></span></button>
    </div>
  </section>

  <!-- ===== Panels ===== -->
  <div class="modal" id="panel-daily" data-panel="daily" hidden>
    <div class="card sheet" role="dialog" aria-labelledby="daily-h">
      <div class="sheet-head"><h3 id="daily-h"><span data-icon="calendar"></span>Daily challenge</h3><button class="btn icon-btn" data-close aria-label="Close" data-sfx><span data-icon="close"></span></button></div>
      <div class="sheet-body scroll" id="daily-body"></div>
    </div>
  </div>
  <div class="modal" id="panel-goals" data-panel="goals" hidden>
    <div class="card sheet" role="dialog" aria-labelledby="goals-h">
      <div class="sheet-head"><h3 id="goals-h"><span data-icon="target"></span>Goals</h3><button class="btn icon-btn" data-close aria-label="Close" data-sfx><span data-icon="close"></span></button></div>
      <div class="sheet-body scroll" id="goals-body"></div>
    </div>
  </div>
  <div class="modal" id="panel-records" data-panel="records" hidden>
    <div class="card sheet" role="dialog" aria-labelledby="records-h">
      <div class="sheet-head"><h3 id="records-h"><span data-icon="trophy"></span>Records</h3><button class="btn icon-btn" data-close aria-label="Close" data-sfx><span data-icon="close"></span></button></div>
      <div class="sheet-body scroll" id="records-body"></div>
    </div>
  </div>
  <div class="modal" id="panel-settings" data-panel="settings" hidden>
    <div class="card sheet" role="dialog" aria-labelledby="settings-h">
      <div class="sheet-head"><h3 id="settings-h"><span data-icon="gear"></span>Settings</h3><button class="btn icon-btn" data-close aria-label="Close" data-sfx><span data-icon="close"></span></button></div>
      <div class="sheet-body scroll" id="settings-body"></div>
    </div>
  </div>
  <div class="modal" id="panel-pause" data-panel="pause" hidden>
    <div class="card sheet" role="dialog" aria-labelledby="pause-h" style="width:min(380px,100%)">
      <div class="sheet-head"><h3 id="pause-h"><span data-icon="pause"></span>Paused</h3></div>
      <div class="sheet-body scroll">
        <div class="pause-actions">
          <button class="btn btn-green btn-big" id="pause-resume" data-sfx><span data-icon="play"></span>Resume</button>
          <div class="pause-toggles">
            <button class="btn btn-sm" id="pause-sound" data-sfx></button>
            <button class="btn btn-sm" id="pause-music" data-sfx></button>
          </div>
          <button class="btn btn-hot" id="pause-end" data-sfx><span data-icon="flag"></span>End run</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="vendor/matter.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
